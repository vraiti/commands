name: Build wheel

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to stamp into the wheel (PEP 440, e.g. 1.2.0 or 1.2.0rc1)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build packaging

      # Rejects a malformed version here rather than letting the backend
      # normalize something unintended into the wheel filename.
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import InvalidVersion, Version

          raw = os.environ["VERSION"].strip()
          try:
              parsed = Version(raw)
          except InvalidVersion as exc:
              raise SystemExit(f"::error::not a PEP 440 version: {raw!r} ({exc})")
          if str(parsed) != raw:
              print(f"::notice::{raw!r} normalizes to {str(parsed)!r}")
          PY

      # hatchling reads the version from __version__ in the package's
      # __init__.py (see [tool.hatch.version]), so stamping it there is what
      # makes the dispatch input reach the wheel. The edit stays in the
      # runner's checkout and is never committed back.
      - name: Stamp version into src/commands/__init__.py
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re

          path = "src/commands/__init__.py"
          version = os.environ["VERSION"].strip()
          source = open(path, encoding="utf-8").read()
          stamped, count = re.subn(
              r'^__version__ = ".*"$',
              f'__version__ = "{version}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"::error::no __version__ assignment found in {path}")
          open(path, "w", encoding="utf-8").write(stamped)
          PY
          tail -n 1 src/commands/__init__.py

      - name: Build wheel
        run: python -m build --wheel --outdir dist/

      # A wheel whose filename disagrees with the requested version means the
      # stamp did not take; fail loudly instead of uploading a mislabelled one.
      - name: Verify wheel version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["VERSION"].strip())
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"::error::expected exactly one wheel, got {[w.name for w in wheels]}")

          name, built, _, _ = parse_wheel_filename(wheels[0].name)
          if name != "commands":
              raise SystemExit(f"::error::unexpected distribution name {name!r} in {wheels[0].name}")
          if built != expected:
              raise SystemExit(f"::error::wheel is version {built}, expected {expected}")
          print(f"::notice::built {wheels[0].name}")
          PY

      - name: Check wheel metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*.whl

      # Smoke test: install the built wheel into a clean venv and import every
      # module, so an import-time break never ships as a "successful" build.
      - name: Import built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import commands
          from commands import _proc, git, rsync, scp, ssh, uv  # noqa: F401

          print("commands", commands.__version__)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: commands-wheel-${{ inputs.version }}
          path: dist/*.whl
          if-no-files-found: error
